name: Verify atlas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-atlas.mjs
      - run: node --check scripts/check-type-lab-browser.mjs
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-type-lab-browser.mjs
      - name: Save typography preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typography-proofing-screenshots
          path: screenshots/type-lab/
          if-no-files-found: ignore
