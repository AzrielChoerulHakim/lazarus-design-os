name: Transfer temporary image staging assets
on:
  push:
    paths:
      - ".github/workflows/transfer-scene-assets.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download staged scene images
        env:
          MASTER_HERO: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Faa1ecf6e-4b63-48e5-9206-14a8006406da/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANAmbkEAClHbA14pa6X6zCAGHK8xccz6Kmm2msZdus8z&exp=1794904012&osig=AAAAAAAAAAAAAAAAAAAAAJFVayXHPNCU8Ib5M9bGYL8Fvp-2WDeAvOeGuh8SJ9Ke&signer=media-rpc&token=AAIAAU0AJGFhMWVjZjZlLTRiNjMtNDhlNS05MjA2LTE0YTgwMDY0MDZkYQAAAAABoeidtOD3oi-77ERZfrODL4jR2ZLOqzj0YAyOE-Xm0YxNYX3USw&x-canva-quality=thumbnail"
          MASTER_PASSAGE: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Fc6943527-3388-4c28-979d-fc66c45d976e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMUba_caEWsxZfhE5YR62Y25Q9AW_JytFbpom7k5h30O&exp=1794901860&osig=AAAAAAAAAAAAAAAAAAAAAJ7vXHpYJx6M7t9ro2iH15e2XrlGGg_gzhKqr8ZQyHby&signer=media-rpc&token=AAIAAU0AJGM2OTQzNTI3LTMzODgtNGMyOC05NzlkLWZjNjZjNDVkOTc2ZQAAAAABoeh83qCtpYJ0rZVAeTCN7FT7BSXxzluiU1rpbWcEQU5xW14P1Q&x-canva-quality=thumbnail"
        run: |
          mkdir -p visual-lab/surrealist/assets
          curl -fLsS --retry 2 "$MASTER_HERO" -o /tmp/hero.png
          curl -fLsS --retry 2 "$MASTER_PASSAGE" -o /tmp/passage.png
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 - <<'PY'
          from PIL import Image
          for name in ["hero","passage"]:
              img=Image.open("/tmp/"+name+".png").convert("RGB")
              assert img.width >= 200 and img.height >= 150, "Staging download failed"
              # A self-contained preview raster; never assemble visual layers.
              img=img.resize((768,576),Image.Resampling.LANCZOS)
              target="visual-lab/surrealist/assets/"+name+"-master.webp"
              img.save(target,"WEBP",quality=69,method=6)
              print(target,Image.open(target).size)
          PY
      - name: Commit raster assets to experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-lab/surrealist/assets/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(surrealist-lab): check in two complete raster scene previews"
            git push origin HEAD:refs/heads/experiment/surrealist-direction-lab-01
          fi
